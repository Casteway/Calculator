<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            
        </div>
        <div class="buttonsContainer">        
        <button class="digitButtons">7</button>
        <button class="digitButtons">8</button>
        <button class="digitButtons">9</button>
        <button class="operatorButtons">X</button>
        <button class="digitButtons">4</button>
        <button class="digitButtons">5</button>
        <button class="digitButtons">6</button>
        <button class="operatorButtons">-</button>
        <button class="digitButtons">1</button>
        <button class="digitButtons">2</button>
        <button class="digitButtons">3</button>
        <button class="operatorButtons">+</button>
        <button class="clearButton">AC</button>
        <button class="operatorButtons">/</button>
        <button class="decimalButton">.</button>
        <button class="sumButton">=</button>
        </div>

    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
